<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicPulse - Track Complaint</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #0f172a;
            color: white;
            padding: 20px 8%;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #0f172a;
        }

        p {
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🏙️ CivicPulse</h1>
</div>

<div class="container">

    <h2>🔎 Track Complaint</h2>

    <p>
        Enter your complaint ID to check the current status
        of your complaint.
    </p>

    <form action="/api/complaints/track" method="get">

        <label for="complaintId">
            Complaint ID
        </label>

        <input
                type="number"
                id="complaintId"
                name="complaintId"
                min="1"
                placeholder="Example: 37"
                required
        >

        <button type="submit">
            🔍 Track Complaint
        </button>

    </form>

    <a class="back" href="/">
        🏠 Back to Home
    </a>

</div>

</body>

</html>
